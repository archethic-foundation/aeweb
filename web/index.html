<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="aeHosting">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aeHosting">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>aeHosting</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var serviceWorkerVersion = '{{flutter_service_worker_version}}';
  </script>
  <script src="flutter.js" defer></script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <script>
    window.addEventListener("load", function (ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        entrypointUrl: "main.dart.js?v=" + serviceWorkerVersion,
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer
            .initializeEngine({
              useColorEmoji: true,
            })
            .then(function (appRunner) {
              appRunner.runApp();
            });
        },
      });
    });
  </script>


  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var domain = window.location.hostname;
      console.log("Plausible - Retrieved Domain:", domain);

      var script = document.createElement('script');
      script.defer = true;
      script.setAttribute('data-domain', domain);
      script.src = 'https://plausible.io/js/script.js';

      document.head.appendChild(script);

      script.onload = function () {
        console.log("Plausible - Script successfully loaded.");
      };

      script.onerror = function (error) {
        console.log("Plausible - Error loading the script:", error);
      };
    });
  </script>

</body>

</html>
